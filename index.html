<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Search Lab</title><style>:root{font-family:Inter,system-ui;color:#ecfeff;background:#071518}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#124b51,#071518 55%)}main{width:min(94vw,1080px);margin:auto;padding:50px 0}.kicker{color:#5eead4;font-weight:800}h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:.95;margin:.4rem 0}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px}.card{margin-top:32px;background:#0d2529cc;border:1px solid #ffffff18;border-radius:26px;padding:24px;box-shadow:0 25px 80px #0006}.controls{display:grid;grid-template-columns:1fr 150px auto;gap:10px}input,button{font:inherit;border-radius:13px;padding:14px;border:1px solid #ffffff24;background:#071518;color:white}button{background:#14b8a6;color:#042f2e;border:0;font-weight:900;cursor:pointer}.array{display:flex;gap:8px;overflow:auto;padding:36px 0 20px}.cell{min-width:64px;height:64px;display:grid;place-items:center;border-radius:16px;background:#14363a;border:1px solid #ffffff12;font-weight:800;transition:.25s}.cell.dim{opacity:.2;transform:scale(.9)}.cell.mid{background:#fbbf24;color:#422006;transform:translateY(-10px);box-shadow:0 10px 30px #fbbf2444}.cell.found{background:#5eead4;color:#042f2e}.status{min-height:3rem;color:#a7c8cb}.metrics{display:flex;gap:28px;color:#a7c8cb}.metrics b{color:white;font-size:1.5rem}@media(max-width:650px){.intro{display:block}.controls{grid-template-columns:1fr}.array{padding-top:25px}}</style></head><body><main><div class="intro"><div><div class="kicker">Algorithm visualizer</div><h1>Binary Search Lab</h1></div><p>Watch the search space halve with every comparison.</p></div><section class="card"><div class="controls"><input id="values" value="3, 5, 8, 12, 15, 20, 25, 30" aria-label="Sorted numbers"><input id="target" type="number" value="15" aria-label="Target"><button id="search">Run search</button></div><div class="array" id="array"></div><p class="status" id="status">Ready to search.</p><div class="metrics"><span>Comparisons <b id="comparisons">0</b></span><span>Remaining <b id="remaining">8</b></span></div></section><script>const wait=ms=>new Promise(r=>setTimeout(r,ms));let run=0;async function search(){const id=++run,nums=values.value.split(',').map(Number).filter(Number.isFinite).sort((a,b)=>a-b),t=+target.value;array.innerHTML=nums.map((n,i)=>`<div class="cell" data-i="${i}">${n}</div>`).join('');let l=0,r=nums.length-1,count=0;comparisons.textContent=0;while(l<=r&&id===run){document.querySelectorAll('.cell').forEach((el,i)=>{el.className='cell'+(i<l||i>r?' dim':'')});const m=l+Math.floor((r-l)/2),cell=document.querySelector(`[data-i="${m}"]`);cell.classList.add('mid');count++;comparisons.textContent=count;remaining.textContent=r-l+1;status.textContent=`Compare ${t} with the middle value, ${nums[m]}.`;await wait(700);if(nums[m]===t){cell.className='cell found';status.textContent=`Found ${t} at sorted index ${m}.`;return}if(nums[m]<t)l=m+1;else r=m-1}status.textContent=`${t} is not in this data set.`;remaining.textContent=0}document.querySelector('#search').onclick=search;search()</script></main></body></html>
